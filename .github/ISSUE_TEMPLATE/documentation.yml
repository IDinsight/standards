name: Suggest a documentation change
description: Point out unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page-url
    attributes:
      label: Which page?
      description: Paste the URL of the page that needs attention.
      placeholder: https://idinsight.github.io/standards/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs to change?
      description: Explain what is unclear, missing, or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Share wording or an example if you have one.
