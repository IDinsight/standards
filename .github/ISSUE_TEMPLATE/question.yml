name: Ask a question
description: Ask about using STANDARDS or understanding its workflow.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. Please search existing issues first and keep private project details out of this public issue.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Tell us what you are trying to do and where you got stuck.
    validations:
      required: true
  - type: input
    id: docs-page
    attributes:
      label: Related docs page
      description: Paste a URL if a documentation page led to the question.
      placeholder: https://idinsight.github.io/standards/...
  - type: textarea
    id: context
    attributes:
      label: More context
      description: Share relevant steps or examples without credentials or private data.
