name: Report a bug
description: Report unexpected behavior in STANDARDS or the docs site.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Remove credentials and private project data from logs or screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: STANDARDS version or docs page
      description: Include the installed version or the URL of the affected docs page.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant output or screenshots after removing private data.
