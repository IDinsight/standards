version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One pull request for all action updates.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # One pull request for minor and patch updates. Major updates stay separate.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # The eval harness's judge calls go through the Anthropic SDK, so it is
    # updated by hand between eval suites, after `pnpm evals selftest` and
    # `pnpm evals preflight --execute`.
    ignore:
      - dependency-name: "@anthropic-ai/sdk"
