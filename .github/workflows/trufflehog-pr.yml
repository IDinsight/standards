name: Secret Scan (TruffleHog) on PRs to Main

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history so base/head comparison works)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # important for comparing against base branch history

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # Scan only the commits in this PR: base..head
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          path: .
          # Recommended flags: keep logs small and fail only on live/validated secrets.
          extra_args: --only-verified

        # Intentionally allow the step to continue since we control failure below.
        continue-on-error: true

      - name: Fail if secrets found
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
