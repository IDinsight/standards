name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # One queue per workflow+branch. On this workflow that's always
  # "Release Please-refs/heads/main", so pushes to main serialize.
  group: ${{ github.workflow }}-${{ github.ref }}

  # false = let an in-flight run finish before the next starts.
  # true would cancel it mid-run and risk a half-updated release PR.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN_STANDARDS }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
