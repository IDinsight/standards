# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in its
# agent picker. The skill's actual instructions live in ../SKILL.md, which the Agent
# Skills client installs alongside this file and loads when the skill runs.
interface:
  default_prompt: "Use $architect to turn the approved scope into a buildable technical design. Resolve material technical decisions, define relevant contracts and technical acceptance criteria, avoid changing scope or implementing code, then hand off to Auditor for greenfield/bootstrap context or Developer when project context is current."
  display_name: "Architect"
  short_description: "Turn approved scope into a buildable technical design."

policy:
  allow_implicit_invocation: false
  products:
    - CODEX
