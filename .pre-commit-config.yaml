# Eval fixtures are synthetic projects that must stay byte for byte as
# reviewed (a run refuses any other build), so no hook checks or fixes them.
# Nor the reference evals' known solutions: patches whose blank context lines
# are a single space, which the whitespace hooks would strip.
exclude: '^evals/(fixtures/|harness/samples/|harness/selftest/[^/]+/|references/graders/[^/]+/[^/]+\.patch$)'

repos:
# Generic file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0  # Use the revision sha / tag you want to point at
  hooks:
    - id: check-yaml
      args: [ "--unsafe" ]
    - id: end-of-file-fixer
    - id: trailing-whitespace

# Detect secrets
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '((^|/)pnpm-lock\.yaml$|\.template\.env$)'

# Markdown style checks
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.23.2
  hooks:
    - id: markdownlint-cli2
      language_version: "24.15.0"
      exclude: '^CHANGELOG\.md$'
