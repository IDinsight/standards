repos:
# Generic file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0  # Use the revision sha / tag you want to point at
  hooks:
    - id: check-yaml
      args: [ "--unsafe" ]
    - id: end-of-file-fixer
    - id: trailing-whitespace

# Detect secrets
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(frontend/pnpm-lock\.yaml|\.template\.env$)'

# Markdown style checks
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.23.2
  hooks:
    - id: markdownlint-cli2
      language_version: "24.15.0"
      exclude: '(^PROTOCOL\.md$|^CHANGELOG\.md$|(^|/)\.standards/CYCLE_IDS\.md$)'
