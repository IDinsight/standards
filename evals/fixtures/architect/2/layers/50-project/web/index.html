<!doctype html>
<html lang="en" data-api="https://api.tallyhub.example">
  <head>
    <meta charset="utf-8">
    <title>TallyHub</title>
  </head>
  <body>
    <header>Signed in as <span id="role"></span> <button id="logout">Sign out</button></header>
    <form id="add-expense">
      <input name="amount" type="number" step="0.01" required>
      <input name="category" required>
      <input name="date" type="date" required>
      <input name="note">
      <button>Add</button>
    </form>
    <ul id="expenses"></ul>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
