[project]
name = "worker"
version = "0.2.0"
description = "Reminder jobs for fieldwork enumerators"
requires-python = ">=3.11"
dependencies = ["shared"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv.sources]
shared = { path = "../../packages/shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
