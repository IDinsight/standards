# Hand-maintained API contract for the datahub API.
# The web client's TypeScript types are generated from this file when apps/web
# is built (`pnpm build`).
openapi: 3.1.0
info:
  title: datahub API
  version: 0.4.0
paths:
  /imports:
    post:
      operationId: createImport
      summary: Upload a CSV file to import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadForm'
      responses:
        '201':
          description: The import job was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          description: The uploaded file is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The uploaded file is larger than 10 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}:
    get:
      operationId: getImport
      summary: Get an import job
      security:
        - bearerAuth: []
      parameters:
        - name: import_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ImportJob:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [running, done]
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    UploadForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
