# PostgreSQL for the integration tests:
#   docker compose -f compose.test.yaml up -d
#   TEST_DATABASE_URL=postgresql://records:records@localhost:55432/records_test python -m pytest -m integration
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records
      POSTGRES_DB: records_test
    ports:
      - "55432:5432"
