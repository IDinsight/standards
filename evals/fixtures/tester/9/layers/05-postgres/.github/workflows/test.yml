name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: records
          POSTGRES_PASSWORD: records
          POSTGRES_DB: records_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U records"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://records:records@localhost:5432/records_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -m "not integration"
      - run: python -m pytest -m integration
