[project]
name = "records-service"
version = "0.2.0"
description = "Record storage and listing for the records admin tool"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1,<3.3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs against the PostgreSQL service in compose.test.yaml; needs TEST_DATABASE_URL",
]
