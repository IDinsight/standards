[project]
name = "survey-service"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
