[project]
name = "records-export-cli"
version = "0.5.0"
description = "Export records dumps to CSV"
requires-python = ">=3.10"

[project.scripts]
export-cli = "export_cli.cli:entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
