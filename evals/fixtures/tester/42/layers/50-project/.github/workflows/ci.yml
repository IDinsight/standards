name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cases
          POSTGRES_PASSWORD: cases
          POSTGRES_DB: cases_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cases"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://cases:cases@localhost:5432/cases_test
      TEST_DATABASE_URL: postgresql+psycopg://cases:cases@localhost:5432/cases_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
