[project]
name = "records-admin"
version = "0.3.0"
description = "Backend for the internal records admin tool"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["records"]
python_version = "3.11"
strict = true
warn_unused_ignores = true
