[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durfmt"
version = "0.3.0"
description = "Parse and format short human-readable durations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
durfmt = "durfmt.cli:main"

[project.urls]
Source = "https://github.com/durfmt/durfmt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
