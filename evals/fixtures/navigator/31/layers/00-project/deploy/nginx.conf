# Production reverse proxy for the quotes service (quotes.parcelwise-prod.net).

log_format quotes '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

upstream quotes_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name quotes.parcelwise-prod.net;

    ssl_certificate     /etc/ssl/parcelwise/fullchain.pem;
    ssl_certificate_key /etc/ssl/parcelwise/privkey.pem;

    access_log /var/log/nginx/quotes.access.log quotes;

    # Gateway errors keep the API's JSON shape so checkout shows its retry message.
    error_page 504 = @gateway_timeout;

    location / {
        proxy_pass http://quotes_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    location @gateway_timeout {
        default_type application/json;
        return 504 '{"error":"rates_unavailable"}';
    }
}
